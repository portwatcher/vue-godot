name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      real_device_evidence_path:
        description: Path to real-device evidence JSON committed in this ref.
        required: true
        default: release/real-device-evidence.json
        type: string
      expected_commit:
        description: Tested release commit recorded in real-device evidence.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Update npm
        run: npm install -g npm@^11.15.0

      - name: Install
        run: npm ci

      - name: Setup GodotJS
        uses: ./.github/actions/setup-godotjs

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Release preflight
        env:
          VUE_GODOT_REAL_DEVICE_EVIDENCE: ${{ inputs.real_device_evidence_path }}
        run: >
          xvfb-run -a --server-args="-screen 0 1280x720x24"
          npm run release:preflight --
          --expected-commit "${{ inputs.expected_commit }}"
          --summary-output release/release-preflight-summary.json

      - name: Upload release preflight summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight-summary
          path: release/release-preflight-summary.json
          if-no-files-found: warn
