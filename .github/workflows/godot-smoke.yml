name: Godot Smoke

on:
  pull_request:
    paths:
      - '.github/actions/setup-godotjs/**'
      - '.github/workflows/godot-smoke.yml'
      - 'apps/game-ui-demo/**'
      - 'apps/html-demo/**'
      - 'apps/native-app-demo/**'
      - 'package*.json'
      - 'packages/**'
      - 'scripts/smoke-editor-reload.mjs'
      - 'scripts/smoke-generated-godot.mjs'
      - 'scripts/smoke-godot.mjs'
      - 'scripts/smoke-utils.mjs'
      - 'scripts/setup-godotjs.mjs'
      - 'turbo.json'
  push:
    branches:
      - develop
      - main
    paths:
      - '.github/actions/setup-godotjs/**'
      - '.github/workflows/godot-smoke.yml'
      - 'apps/game-ui-demo/**'
      - 'apps/html-demo/**'
      - 'apps/native-app-demo/**'
      - 'package*.json'
      - 'packages/**'
      - 'scripts/smoke-editor-reload.mjs'
      - 'scripts/smoke-generated-godot.mjs'
      - 'scripts/smoke-godot.mjs'
      - 'scripts/smoke-utils.mjs'
      - 'scripts/setup-godotjs.mjs'
      - 'turbo.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Update npm
        run: npm install -g npm@^11.15.0

      - name: Setup GodotJS
        uses: ./.github/actions/setup-godotjs

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Godot smoke
        run: npm run smoke:godot

      - name: Generated Godot smoke
        run: npm run smoke:generated-godot

      - name: Editor reload smoke
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" npm run smoke:editor-reload
