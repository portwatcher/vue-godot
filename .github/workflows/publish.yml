name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag to publish with.
        required: true
        default: latest
        type: string
      skip_public_smoke:
        description: Skip post-publish public CLI smoke.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@^11.15.0

      - name: Install
        run: npm ci

      - name: Setup GodotJS
        uses: ./.github/actions/setup-godotjs

      - name: Publish
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
          SKIP_PUBLIC_SMOKE: ${{ inputs.skip_public_smoke || false }}
          VUE_GODOT_NPM_TRUSTED_PUBLISHING: '1'
        run: |
          args=(--yes --tag "$NPM_DIST_TAG")
          if [ "$SKIP_PUBLIC_SMOKE" = "true" ]; then
            args+=(--skip-public-smoke)
          fi

          npm run release:publish -- "${args[@]}"
