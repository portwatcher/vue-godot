name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag to publish with.
        required: true
        default: latest
        type: string
      skip_public_smoke:
        description: Skip post-publish public CLI smoke.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  runtime-release:
    name: Verify runtime release matrix
    uses: ./.github/workflows/godot-js-runtime-release.yml
    permissions:
      contents: read

  publish:
    needs: runtime-release
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Update npm
        run: npm install -g npm@^11.15.0

      - name: Install
        run: npm ci

      - name: Setup official Godot
        uses: ./.github/actions/setup-godot
        with:
          version: 4.4.1-stable

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Download verified release manifest and archives
        uses: actions/download-artifact@v8
        with:
          name: godot-js-runtime-release
          path: .artifacts/godot-js-runtime/0.0.1

      - name: Download verified Linux runtime
        uses: actions/download-artifact@v8
        with:
          name: godot-js-runtime-linux
          path: packages/godot-js-runtime/addon/godot-js-runtime/bin

      - name: Verify publish inputs match the committed release manifest
        run: |
          cmp \
            .artifacts/godot-js-runtime/0.0.1/runtime-manifest.json \
            packages/godot-js-runtime/addon/godot-js-runtime/runtime-manifest.json
          npm run verify:release --workspace=godot-js-runtime -- --platform linux

      - name: Publish
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
          SKIP_PUBLIC_SMOKE: ${{ inputs.skip_public_smoke || false }}
        run: |
          args=(--yes --tag "$NPM_DIST_TAG")
          if [ "$SKIP_PUBLIC_SMOKE" = "true" ]; then
            args+=(--skip-public-smoke)
          fi

          xvfb-run -a --server-args="-screen 0 1280x720x24" npm run release:publish -- "${args[@]}"
