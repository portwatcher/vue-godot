name: Godot JavaScript Runtime Release Matrix

on:
  workflow_call:
  pull_request:
    paths:
      - '.github/actions/setup-godot/**'
      - '.github/actions/setup-godot-export-templates/**'
      - '.github/workflows/godot-js-runtime-release.yml'
      - '.github/workflows/publish.yml'
      - 'apps/js-runtime-demo/**'
      - 'apps/native-app-demo/**'
      - 'package*.json'
      - 'packages/godot-js-runtime/**'
      - 'scripts/official-godot-export-templates.json'
      - 'scripts/official-godot-releases.json'
      - 'scripts/release-*.mjs'
      - 'scripts/setup-godot*.mjs'
  push:
    branches:
      - develop
      - main
    paths:
      - '.github/actions/setup-godot/**'
      - '.github/actions/setup-godot-export-templates/**'
      - '.github/workflows/godot-js-runtime-release.yml'
      - '.github/workflows/publish.yml'
      - 'apps/js-runtime-demo/**'
      - 'apps/native-app-demo/**'
      - 'package*.json'
      - 'packages/godot-js-runtime/**'
      - 'scripts/official-godot-export-templates.json'
      - 'scripts/official-godot-releases.json'
      - 'scripts/release-*.mjs'
      - 'scripts/setup-godot*.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-js-runtime-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-artifacts:
    name: Build ${{ matrix.platform }} artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: ios
            runner: macos-14
          - platform: windows
            runner: ubuntu-24.04
          - platform: linux
            runner: ubuntu-24.04
          - platform: android
            runner: ubuntu-24.04
          - platform: web
            runner: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install
        run: npm ci

      - name: Install Windows cross compiler
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64-x86-64 g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          x86_64-w64-mingw32-g++ --version
          test "$(x86_64-w64-mingw32-g++ -v 2>&1 | sed -n 's/^Thread model: //p')" = posix

      - name: Install WebAssembly inspection tools
        if: matrix.platform == 'web'
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
          wasm-validate --version

      - name: Setup pinned Android SDK tools and NDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '14742923'
          packages: 'ndk;23.2.8568313'

      - name: Export pinned Android NDK
        if: matrix.platform == 'android'
        run: |
          test -x "${ANDROID_SDK_ROOT}/ndk/23.2.8568313/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Build pinned Web artifacts
        if: matrix.platform == 'web'
        run: >-
          docker run --rm --platform linux/amd64
          --volume "$GITHUB_WORKSPACE:/workspace"
          --workdir /workspace
          emscripten/emsdk@sha256:2d3fb46aa26bf2824b14c1c12a4002c1a04751b0e935f907a101c2554610214d
          node packages/godot-js-runtime/scripts/build-release-artifacts.mjs
          --platform web --mode all --clean

      - name: Build release artifacts
        if: matrix.platform != 'web'
        run: >-
          npm run build:release --workspace=godot-js-runtime --
          --platform "${{ matrix.platform }}" --mode all --clean

      - name: Verify release artifacts
        run: >-
          npm run verify:release --workspace=godot-js-runtime --
          --platform "${{ matrix.platform }}"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: godot-js-runtime-${{ matrix.platform }}
          path: packages/godot-js-runtime/addon/godot-js-runtime/bin
          compression-level: 0
          if-no-files-found: error

  package-release:
    name: Package verified release archives
    needs: build-release-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: godot-js-runtime-*
          path: packages/godot-js-runtime/addon/godot-js-runtime/bin
          merge-multiple: true

      - name: Package deterministic release archives
        run: npm run package:godot-js-runtime

      - name: Test clean offline installation
        run: npm run test --workspace=godot-js-runtime

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: godot-js-runtime-release
          path: .artifacts/godot-js-runtime/0.0.1
          compression-level: 0
          if-no-files-found: error

  export-smoke:
    name: Export ${{ matrix.label }}
    needs: package-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            artifact: linux
            runner: ubuntu-24.04
            platforms: linux
            launch_argument: ''
          - label: Windows
            artifact: windows
            runner: windows-2025
            platforms: windows
            launch_argument: ''
          - label: macOS and iOS
            artifact: apple
            runner: macos-14
            platforms: macos,ios
            launch_argument: ''
          - label: Android structural
            artifact: android
            runner: ubuntu-24.04
            platforms: android
            launch_argument: --skip-launch
          - label: Web
            artifact: web
            runner: ubuntu-24.04
            platforms: web
            launch_argument: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup official Godot
        uses: ./.github/actions/setup-godot
        with:
          version: 4.4.1-stable

      - name: Setup official export templates
        uses: ./.github/actions/setup-godot-export-templates
        with:
          version: 4.4.1-stable

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: godot-js-runtime-release
          path: .artifacts/godot-js-runtime/0.0.1

      - name: Export both applications in debug and release modes
        shell: bash
        run: >-
          node packages/godot-js-runtime/scripts/smoke-platform-exports.mjs
          --platform "${{ matrix.platforms }}"
          --release-dir .artifacts/godot-js-runtime/0.0.1
          ${{ matrix.launch_argument }}

      - name: Upload export evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: export-evidence-${{ matrix.artifact }}
          path: .artifacts/platform-exports/*-evidence.json
          if-no-files-found: warn
