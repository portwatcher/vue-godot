name: Setup official Godot
description: Install a checksummed official Godot editor and expose it as GODOT_BIN.

inputs:
  version:
    description: Official Godot release tag.
    required: false
    default: 4.4.1-stable

runs:
  using: composite
  steps:
    - name: Cache official Godot
      uses: actions/cache@v5
      with:
        path: .cache/godot-official/${{ inputs.version }}
        key: official-godot-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install Godot runtime dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ca-certificates \
          libasound2 \
          libdbus-1-3 \
          libfontconfig1 \
          libgl1 \
          libglu1-mesa \
          libpulse0 \
          libudev1 \
          libx11-6 \
          libxcursor1 \
          libxi6 \
          libxinerama1 \
          libxkbcommon0 \
          libxrandr2 \
          unzip

    - name: Setup official Godot
      shell: bash
      run: >-
        node scripts/setup-godot.mjs
        --version "${{ inputs.version }}"
        --github-env "$GITHUB_ENV"
