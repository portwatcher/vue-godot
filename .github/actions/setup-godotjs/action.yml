name: Setup GodotJS
description: Install runtime dependencies and expose the pinned GodotJS editor as GODOT_BIN.

runs:
  using: composite
  steps:
    - name: Cache GodotJS
      id: cache-godotjs
      uses: actions/cache@v4
      with:
        path: .cache/godotjs/GodotJS_1.0.0-2/prebuilt_linux_x64_v8
        key: godotjs-${{ runner.os }}-GodotJS_1.0.0-2-prebuilt_linux_x64_v8

    - name: Install Godot runtime dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ca-certificates \
          libasound2 \
          libdbus-1-3 \
          libfontconfig1 \
          libgl1 \
          libglu1-mesa \
          libpulse0 \
          libudev1 \
          libx11-6 \
          libxcursor1 \
          libxi6 \
          libxinerama1 \
          libxkbcommon0 \
          libxrandr2 \
          unzip

    - name: Download GodotJS
      if: steps.cache-godotjs.outputs.cache-hit != 'true'
      shell: bash
      run: |
        GODOTJS_CACHE_DIR=".cache/godotjs/GodotJS_1.0.0-2/prebuilt_linux_x64_v8"
        mkdir -p "$GODOTJS_CACHE_DIR"
        curl --fail --location --retry 3 \
          --output "$RUNNER_TEMP/godotjs.zip" \
          "https://github.com/ialex32x/GodotJS-Build/releases/download/GodotJS_1.0.0-2/prebuilt_linux_x64_v8.zip"
        unzip -q "$RUNNER_TEMP/godotjs.zip" -d "$GODOTJS_CACHE_DIR"

    - name: Locate GodotJS executable
      shell: bash
      run: |
        GODOTJS_CACHE_DIR=".cache/godotjs/GodotJS_1.0.0-2/prebuilt_linux_x64_v8"
        GODOT_BIN="$(find "$GODOTJS_CACHE_DIR" -type f -name 'godot.linuxbsd.editor.*.x86_64' | sort | head -n 1)"
        if [ -z "$GODOT_BIN" ]; then
          echo "Unable to locate GodotJS editor executable in $GODOTJS_CACHE_DIR" >&2
          find "$GODOTJS_CACHE_DIR" -maxdepth 3 -type f | sort >&2
          exit 1
        fi

        chmod +x "$GODOT_BIN"
        echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
        "$GODOT_BIN" --version
