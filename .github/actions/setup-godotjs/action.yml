name: Setup GodotJS
description: Install runtime dependencies and expose the pinned GodotJS editor as GODOT_BIN.

inputs:
  release:
    description: GodotJS release tag from ialex32x/GodotJS-Build.
    required: false
    default: GodotJS_1.0.0-2
  asset:
    description: GodotJS release asset without the .zip suffix.
    required: false
    default: prebuilt_linux_x64_v8

runs:
  using: composite
  steps:
    - name: Cache GodotJS
      id: cache-godotjs
      uses: actions/cache@v5
      with:
        path: .cache/godotjs/${{ inputs.release }}/${{ inputs.asset }}
        key: godotjs-${{ runner.os }}-${{ inputs.release }}-${{ inputs.asset }}

    - name: Install Godot runtime dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ca-certificates \
          libasound2 \
          libdbus-1-3 \
          libfontconfig1 \
          libgl1 \
          libglu1-mesa \
          libpulse0 \
          libudev1 \
          libx11-6 \
          libxcursor1 \
          libxi6 \
          libxinerama1 \
          libxkbcommon0 \
          libxrandr2 \
          unzip

    - name: Setup GodotJS
      shell: bash
      run: |
        node scripts/setup-godotjs.mjs \
          --release "${{ inputs.release }}" \
          --asset "${{ inputs.asset }}" \
          --github-env "$GITHUB_ENV"
